<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0c10;--mute:#5b6478;--blue:#3b82f6;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.8);--line:rgba(15,23,42,.1);--panel:rgba(255,255,255,.88);--bg:rgba(255,255,255,.7);--err:#b4232c;--shadow:0 10px 40px rgba(37,99,235,.14)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;display:flex;flex-direction:column;color:var(--ink);font:16px/1.55 "Outfit",system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:radial-gradient(60vw 55vh at 90% -5%,#93c5fd 0,transparent 70%),radial-gradient(55vw 50vh at -5% 35%,#bae6fd 0,transparent 70%),radial-gradient(40vw 40vh at 70% 100%,#dbeafe 0,transparent 70%),linear-gradient(160deg,#fff,#eaf3ff 60%,#d6e8ff);background-attachment:fixed}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 20px}
main{flex:1}
[hidden]{display:none!important}
.glass,.bar,.row,header .wrap,.cats button,.cfg{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--edge);box-shadow:var(--shadow)}
header{position:sticky;top:0;z-index:20;padding:12px 0}
header .wrap{display:flex;align-items:center;gap:14px;height:58px;border-radius:99px;padding:0 10px 0 22px;max-width:1000px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em;margin-right:auto;cursor:pointer;display:flex;align-items:center;gap:9px}
.brand svg{width:30px;height:30px;flex:none}
nav{display:flex;gap:6px}
nav button{background:rgba(255,255,255,.6);border:1px solid var(--line);color:var(--ink);padding:6px 16px;cursor:pointer;border-radius:99px;transition:background .15s}
nav button:hover{background:#fff}
nav button.on{background:none;border-color:transparent;font-weight:700;cursor:default;position:relative}
nav button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-3px;width:20px;height:3px;border-radius:3px;background:var(--blue)}
.av.on{box-shadow:0 0 0 3px rgba(59,130,246,.55)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:99px;padding:10px 20px;font-weight:600;cursor:pointer;transition:background .2s}
.btn:hover{background:#1d4ed8}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#fff}
.btn.sm{padding:6px 15px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
h1{font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.04em;margin:56px 0 14px;max-width:13em;font-weight:700}
.lede{color:var(--mute);margin:0 0 30px;max-width:32em;font-size:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:10px;border-radius:22px;margin-bottom:16px}
.bar input,.bar select{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.bar input{flex:1;min-width:180px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.cats button{border-radius:99px;padding:6px 16px;color:var(--mute);cursor:pointer;font-size:15px;box-shadow:none}
.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.row{display:flex;flex-direction:column;border-radius:24px;overflow:hidden}
.pic{aspect-ratio:4/3;position:relative;display:grid;place-items:center;font-size:64px;font-weight:700;color:#93c5fd;background:linear-gradient(135deg,#e0f2fe,#fff 60%,#bfdbfe)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row.claimed .pic img{filter:grayscale(1);opacity:.55}
.prof{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:22px;border-radius:28px;margin-top:40px}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;position:relative;display:grid;place-items:center;font-size:34px;font-weight:700;color:#3b82f6;background:linear-gradient(135deg,#e0f2fe,#bfdbfe);cursor:pointer;border:3px solid #fff;flex:none;margin:0}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pinfo{flex:1;min-width:160px}
.pname{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.pedit{display:flex;gap:8px;flex-wrap:wrap}
.pedit input{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:9px 13px;width:180px}
.pill{position:absolute;top:12px;left:12px;font-size:13px;font-weight:600;padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.85);color:#0369a1;backdrop-filter:blur(8px)}
.pill.c{background:var(--ink);color:#fff}
.body{padding:16px 18px 6px;flex:1}
.row h3{margin:0;font-size:19px;letter-spacing:-.02em;line-height:1.25}
.row.claimed h3{color:var(--mute)}
.meta{color:var(--mute);font-size:14px;margin-top:4px}
.desc{font-size:15px;margin:8px 0 0}
.side{padding:12px 18px 18px;display:flex;gap:8px;flex-wrap:wrap}
.empty{grid-column:1/-1;padding:56px 20px;text-align:center;color:var(--mute)}
.reqs{margin:0 14px 14px;padding:10px 14px;background:rgba(255,255,255,.7);border-radius:14px;font-size:14px}
.reqs p{margin:4px 0}
dialog{border:1px solid var(--edge);border-radius:26px;background:var(--panel);backdrop-filter:blur(24px);color:var(--ink);padding:26px;width:min(460px,92vw);box-shadow:0 30px 80px rgba(30,64,175,.25)}
dialog::backdrop{background:rgba(147,197,253,.35);backdrop-filter:blur(6px)}
dialog h2{margin:0 0 14px;font-size:24px;letter-spacing:-.03em}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{resize:vertical;min-height:76px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.msg{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(236,242,250,.85);color:var(--ink);border:1px solid rgba(148,163,184,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(30,64,175,.18);padding:11px 20px;border-radius:99px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
#toast::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:10px}
.note{margin:0 0 4px;padding:10px 14px;border-radius:12px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:#1e3a8a;font-size:14px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.act{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:9px 18px;font-weight:600;text-decoration:none;color:#fff;transition:filter .15s}
.act:hover{filter:brightness(.92)}
.act svg{width:18px;height:18px;flex:none}
.act.call,.act.mail{background:#2563eb}
.act.wa{background:#25d366}
#toast.show{opacity:1}
.cfg{border-radius:20px;padding:16px 22px;margin-top:30px}
footer{margin-top:64px;padding:26px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(15,23,42,.08);text-align:center;color:var(--mute);font-size:14px;background:rgba(255,255,255,.35)}
.btn.ghost.danger{color:#d92d20;border-color:rgba(217,45,32,.3)}
.btn.ghost.danger:hover{background:rgba(217,45,32,.1)}
.btn.red,.btn.red:hover{background:#d92d20;color:#fff}
.btn.red:hover{background:#b42318}
a.btn{text-decoration:none;display:inline-block}
.brand{white-space:nowrap;text-decoration:none;color:var(--ink)}
.user{position:relative;flex:none}
.av{width:42px;height:42px;border-radius:50%;border:2px solid #fff;padding:0;overflow:hidden;position:relative;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,#0a0c10,#3b82f6);cursor:pointer;box-shadow:0 2px 12px rgba(37,99,235,.3)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:0;top:100%;padding-top:12px;min-width:230px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility .18s;z-index:30}
.user.open .menu{opacity:1;visibility:visible;transform:none}
@media(hover:hover) and (pointer:fine){.user:hover .menu{opacity:1;visibility:visible;transform:none}}
.mbox{background:rgba(255,255,255,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--edge);border-radius:18px;box-shadow:0 20px 50px rgba(30,64,175,.22);padding:8px}
.mhead{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.mhead b{display:block;font-size:16px}
.mhead span{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.mbox button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:15px}
.mbox button:hover{background:rgba(59,130,246,.12)}
#mOut{color:#d92d20;font-weight:600}
#mOut:hover{background:rgba(217,45,32,.1)}
.cval{margin:14px 0 0;padding:14px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:18px;font-weight:600;word-break:break-word}
@media(max-width:640px){header .wrap{padding:0 8px 0 16px;gap:6px;height:54px}.brand{font-size:16px;gap:7px}.brand svg{width:26px;height:26px}nav{gap:4px}nav button{padding:5px 9px;font-size:14px}.av{width:38px;height:38px}.bar input{flex:1 1 100%}.bar select{flex:1 1 calc(50% - 5px);min-width:0}.bar .btn{flex:1 1 100%}.cats{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px 22px;padding:2px 20px 8px;scrollbar-width:none}.cats button{flex:none}.list{grid-template-columns:1fr}.prof{flex-direction:column;align-items:flex-start}.pedit{width:100%}.pedit input{flex:1;width:auto}h1{margin-top:36px}.lede{font-size:16px}}

</style>

<body>
<header><div class="wrap">
  <a class="brand" id="home" href="./" aria-label="ReUse Campus home"><svg aria-hidden="true" viewBox="0 0 32 32"><defs><linearGradient id="lgh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lgh)"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5A7 7 0 0 1 21.6 11"/><path d="M22.5 17.5A7 7 0 0 1 10.4 21"/><path d="M22 7.5v4h-4"/><path d="M10 24.5v-4h4"/></g></svg><span>ReUse Campus</span></a>
  <nav><button id="nBrowse" class="on" aria-current="page">Browse</button></nav>
  <button class="btn sm" id="nAuth">Sign in</button>

    <button class="av" id="avBtn" aria-label="Account menu" aria-haspopup="menu"><span id="avIn"></span></button>

      <div class="mhead"><b id="mName"></b><span id="mMail"></span></div>
      <button role="menuitem" id="mProfile">Profile</button>
      <button role="menuitem" id="mOut">Sign out</button>
    </div></div>
  </div>
</div></header>

<main class="wrap" id="app"></main>
<footer><div class="wrap">© 2026 ReUse Campus | Designed by Afreen</div></footer>

<dialog id="dAuth"><h2 id="aTitle">Sign in</h2>
  <p class="note" id="aNote" hidden></p>
  <div id="nameBox" hidden><label for="aName">Your name</label><input id="aName" autocomplete="name"></div>
  <label for="aMail">College email</label><input id="aMail" type="email" autocomplete="email">
  <label for="aPass">Password</label><input id="aPass" type="password" minlength="6" autocomplete="current-password">
  <div class="msg" id="aMsg"></div>
  <div class="acts"><button class="btn ghost sm" id="aSwap">Create an account</button><button class="btn ghost sm" data-close>Cancel</button><button class="btn sm" id="aGo">Sign in</button></div>
</dialog>

<dialog id="dPost"><h2>List an item</h2>
  <label for="pTitle">What is it?</label><input id="pTitle" maxlength="80" placeholder="Engineering Mathematics, 3rd edition">
  <label for="pCat">Category</label><select id="pCat"></select>
  <label for="pMode">How do you want to pass it on?</label>
  <select id="pMode"><option value="giveaway">Giveaway</option><option value="exchange">Exchange</option></select>
  <div id="wantBox" hidden><label for="pWant">What would you like in return?</label><input id="pWant" maxlength="80"></div>
  <label for="pCond">Condition</label>
  <select id="pCond"><option>Like new</option><option selected>Good</option><option>Worn but usable</option></select>
  <label for="pDesc">Details</label><textarea id="pDesc" maxlength="400" placeholder="Edition, size, where to pick it up"></textarea>
  <label for="pContact">How should people reach you? (phone, WhatsApp or email)</label><input id="pContact" maxlength="80" placeholder="98xxxxxxxx or name@college.edu">
  <label for="pImg">Photo (optional)</label><input id="pImg" type="file" accept="image/*">
  <div class="msg" id="pMsg"></div>
  <div class="acts"><button class="btn ghost sm" data-close>Cancel</button><button class="btn sm" id="pGo">Publish</button></div>
</dialog>

<dialog id="dContact"><h2 id="cTitle"></h2><p class="meta" id="cItem"></p><div class="cval" id="cVal"></div>
  <div class="links" id="cLinks"></div>
  <div class="acts"><button class="btn ghost sm" id="cCopy">Copy</button><button class="btn sm" data-close>Close</button></div>
</dialog>

<dialog id="dDel"><h2>Delete this listing?</h2><p class="meta" id="delItem"></p>
  <p>This permanently removes the listing and its details. This can’t be undone.</p>
  <div class="acts"><button class="btn sm" data-close>Cancel</button><button class="btn red sm" id="delGo">Delete</button></div>
</dialog>

<dialog id="dReq"><h2 id="rTitle">Request item</h2>
  <label for="rMsg">Message to the owner</label><textarea id="rMsg" placeholder="When are you free to pick it up?"></textarea>
  <label for="rContact">How can they reach you?</label><input id="rContact" placeholder="Phone, hostel room or email">
  <div class="msg" id="rErr"></div>
  <div class="acts"><button class="btn ghost sm" data-close>Cancel</button><button class="btn sm" id="rGo">Send request</button></div>
</dialog>
<div id="toast" role="status"></div>

  $("#cTitle").textContent = "Contact " + it.owner_name; $("#cItem").textContent = "About: " + it.title;
  $("#cVal").textContent = c || "The lister has not added contact details.";
  if (c.includes("@")) links = `<a class="act mail" href="mailto:${esc(c)}?subject=${encodeURIComponent("ReUse Campus: " + it.title)}">${IC.mail}Email</a>`;
  else if (d.replace("+", "").length >= 8) { const n = d.replace("+", ""), wa = n.length === 10 ? "91" + n : n; links = `<a class="act call" href="tel:${esc(d)}">${IC.phone}Call</a><a class="act wa" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent("Hi! I saw your " + it.title + " on ReUse Campus.")}">${IC.wa}WhatsApp</a>`; }
  $("#cLinks").innerHTML = links; $("#dContact").showModal();
}
function openAuth(signup, note = ""){
  S.signup = signup; $("#aTitle").textContent = signup ? "Create account" : "Sign in";
  $("#nameBox").hidden = !signup; $("#aGo").textContent = signup ? "Create account" : "Sign in";
  $("#aSwap").textContent = signup ? "I have an account" : "Create an account"; $("#aMsg").textContent = "";
  $("#aNote").textContent = note; $("#aNote").hidden = !note;
  if (!$("#dAuth").open) $("#dAuth").showModal();
}
async function submitAuth(){
  const email = $("#aMail").value.trim(), password = $("#aPass").value, name = $("#aName").value.trim();
  if (!email || password.length < 6) return $("#aMsg").textContent = "Enter an email and a password of at least 6 characters.";
  if (S.signup && !name) return $("#aMsg").textContent = "Enter your name so owners know who is asking.";
  const r = S.signup ? await sb.auth.signUp({ email, password, options: { data: { name } } }) : await sb.auth.signInWithPassword({ email, password });
  if (r.error) return $("#aMsg").textContent = r.error.message;
  if (S.signup && !r.data.session) { $("#aMsg").textContent = "Check your inbox to confirm your email, then sign in."; return; }
  $("#dAuth").close(); toast("Signed in");
}
const myName = () => S.user?.user_metadata?.name || S.user?.email?.split("@")[0] || "Student";

async function saveName(){
  const name = $("#pName").value.trim(); if (!name) return toast("Name cannot be empty");
  const { error } = await sb.auth.updateUser({ data: { name } }); if (error) return toast(error.message);
  await sb.from("listings").update({ owner_name: name }).eq("owner", S.user.id); toast("Name updated"); load();
}
async function saveAvatar(f){
  toast("Uploading photo..."); const blob = await shrink(f, 400); if (!blob) return toast("That file is not a readable image");
  const path = `${S.user.id}/avatar-${Date.now()}.jpg`;
  const up = await sb.storage.from("item-images").upload(path, blob, { contentType: "image/jpeg" }); if (up.error) return toast(up.error.message);
  const url = sb.storage.from("item-images").getPublicUrl(path).data.publicUrl;
  const { error } = await sb.auth.updateUser({ data: { avatar: url } }); if (error) return toast(error.message);
  toast("Profile photo updated"); load();
}
/* ===== Module 2: item listings ===== */
async function load(){
  const { data, error } = await sb.from("listings").select("*").order("created_at", { ascending: false });
  S.items = error ? [] : data;
  if (MODULES.requests && S.user && S.view === "mine") {
    const ids = S.items.filter(i => i.owner === S.user.id).map(i => i.id);
    const r = ids.length ? await sb.from("requests").select("*").in("listing_id", ids).order("created_at") : { data: [] };
    S.reqs = r.data || [];
  }
  render();
}
function shrink(file, max = 1100){ return new Promise(res => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => res(b), "image/jpeg", .82); }; im.onerror = () => res(null); im.src = URL.createObjectURL(file); }); }
async function publish(){
  const title = $("#pTitle").value.trim(); if (!title) return $("#pMsg").textContent = "Give the item a name.";
  const contact = $("#pContact").value.trim(); if (!contact) return $("#pMsg").textContent = "Add a phone number or email so people can reach you.";
  const mode = $("#pMode").value, btn = $("#pGo"); let image_url = null; btn.disabled = true; $("#pMsg").textContent = "";
  const f = $("#pImg").files[0];
  if (f) {
    const blob = await shrink(f); if (!blob) { btn.disabled = false; return $("#pMsg").textContent = "That file is not a readable image."; }
    const path = `${S.user.id}/${Date.now()}.jpg`;
    const up = await sb.storage.from("item-images").upload(path, blob, { contentType: "image/jpeg" });
    if (up.error) { btn.disabled = false; return $("#pMsg").textContent = "Photo upload failed: " + up.error.message; }
    image_url = sb.storage.from("item-images").getPublicUrl(path).data.publicUrl;
  }
  const { error } = await sb.from("listings").insert({ title, category: $("#pCat").value, mode, wanted: mode === "exchange" ? $("#pWant").value.trim() : null, condition: $("#pCond").value, description: $("#pDesc").value.trim(), owner_name: myName(), image_url, contact });
  btn.disabled = false;
  if (error) return $("#pMsg").textContent = error.message;
  $("#dPost").close(); ["#pTitle","#pWant","#pDesc","#pImg"].forEach(x => $(x).value = ""); toast("Published"); load();
}
let delId = null;
function remove(id){ const it = S.items.find(i => i.id === id); delId = id; $("#delItem").textContent = it ? it.title : ""; $("#dDel").showModal(); }
async function doDelete(){ const { error } = await sb.from("listings").delete().eq("id", delId); $("#dDel").close(); if (error) return toast(error.message); toast("Listing deleted"); load(); }

/* ===== Module 3: category search ===== */
function filtered(){
  const q = S.q.toLowerCase();
  return S.items.filter(i => (S.cat === "All" || i.category === S.cat) && (S.mode === "all" || i.mode === S.mode) && (S.status === "all" || i.status === S.status) && (!q || (i.title + " " + (i.description || "")).toLowerCase().includes(q)));
}

/* ===== Module 4: item requests ===== */
function openReq(item){
  if (!S.user) return openAuth(false, "Sign in to request this item.");
  S.reqItem = item; $("#rTitle").textContent = "Request: " + item.title; $("#rErr").textContent = ""; $("#dReq").showModal();
}
async function sendReq(){
  const contact = $("#rContact").value.trim(); if (!contact) return $("#rErr").textContent = "Add a way for the owner to reach you.";
  const { error } = await sb.from("requests").insert({ listing_id: S.reqItem.id, requester_name: myName(), contact, message: $("#rMsg").value.trim() });
  if (error) return $("#rErr").textContent = error.message;
  $("#dReq").close(); $("#rMsg").value = ""; toast("Request sent");
}

/* ===== Module 5: availability status ===== */
async function setStatus(id, status){
  const { error } = await sb.from("listings").update({ status }).eq("id", id);
  if (error) return toast(error.message);
  toast(status === "claimed" ? "Marked as claimed" : "Marked as available"); load();
}

/* ===== Module 6: interface ===== */
function rowHTML(i, mine){
  const reqs = mine ? S.reqs.filter(r => r.listing_id === i.id) : [];
  const claimed = i.status === "claimed";
  const side = mine
    ? (MODULES.status ? `<button class="btn ghost sm" data-st="${i.id}|${claimed ? "available" : "claimed"}">${claimed ? "Mark available" : "Mark claimed"}</button>` : "") + `<button class="btn ghost danger sm" data-del="${i.id}">Delete</button>`
    : (!claimed && i.owner !== S.user?.id ? `<button class="btn sm" data-contact="${i.id}">Contact lister</button>` + (MODULES.requests ? `<button class="btn ghost sm" data-req="${i.id}">Request</button>` : "") : "");
  const pic = i.image_url ? `<img src="${esc(i.image_url)}" alt="${esc(i.title)}" loading="lazy">` : esc(i.category[0]);
  return `<article class="row ${claimed ? "claimed" : ""}"><div class="pic">${pic}${MODULES.status ? `<span class="pill ${claimed ? "c" : ""}">${claimed ? "Claimed" : "Available"}</span>` : ""}</div>
    <div class="body"><h3>${esc(i.title)}</h3>
    <div class="meta">${esc(i.category)} · ${esc(i.condition)} · ${i.mode === "exchange" ? "Exchange" + (i.wanted ? " for " + esc(i.wanted) : "") : "Giveaway"}</div>
    <div class="meta">${esc(i.owner_name)} · ${ago(i.created_at)}</div>
    ${i.description ? `<p class="desc">${esc(i.description)}</p>` : ""}</div>
    ${side ? `<div class="side">${side}</div>` : ""}
    ${mine && MODULES.requests ? `<div class="reqs">${reqs.length ? reqs.map(r => `<p><b>${esc(r.requester_name)}</b>: ${esc(r.message || "No message")} (${esc(r.contact)})</p>`).join("") : "<p>No requests yet.</p>"}</div>` : ""}</article>`;
}
function render(){
  const app = $("#app");
  if (!sb) { app.innerHTML = `<h1>Almost there.</h1><div class="cfg"><b>Connect your database.</b><p>Open index.html and set SUPABASE_URL and SUPABASE_KEY at the top of the script. The URL must look like https://abcdxyz.supabase.co</p>${cfgErr ? `<p>Error: ${esc(cfgErr)}</p>` : ""}</div>`; return; }
  const onB = S.view === "browse"; $("#nBrowse").classList.toggle("on", onB); $("#avBtn").classList.toggle("on", !onB);
  $("#nBrowse").setAttribute("aria-current", onB ? "page" : "false");
  if (S.view === "mine") {
    if (!S.user) { app.innerHTML = `<h1>Your profile</h1><p class="lede">Sign in to manage your profile and your listings.</p><button class="btn" id="goAuth">Sign in</button>`; return; }
    const mine = S.items.filter(i => i.owner === S.user.id), av = S.user.user_metadata?.avatar;
    app.innerHTML = `<section class="glass prof"><label class="avatar" for="avFile" title="Change photo">${av ? `<img src="${esc(av)}" alt="Your photo">` : esc(myName()[0].toUpperCase())}</label><input id="avFile" type="file" accept="image/*" hidden>
      <div class="pinfo"><div class="pname">${esc(myName())}</div><div class="meta">${esc(S.user.email)}</div><div class="meta">${mine.length} item${mine.length === 1 ? "" : "s"} listed</div></div>
      <div class="pedit"><input id="pName" value="${esc(myName())}" maxlength="40" aria-label="Display name"><button class="btn sm" id="pSave">Save name</button></div></section>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:34px 0 18px"><h2 style="margin:0;font-size:26px;letter-spacing:-.03em">Your listings</h2><button class="btn" id="goPost">List an item</button></div>
      <div class="list">${mine.length ? mine.map(i => rowHTML(i, true)).join("") : `<div class="empty">You have nothing listed. Got a calculator gathering dust?</div>`}</div>`;
    return;
  }
  const list = filtered();
  app.innerHTML = `<h1>Pass it on before it ends up in a drawer.</h1>
    <p class="lede">Textbooks, lab coats, calculators and more, from students who are done with them to students who need them.</p>
    <div class="bar"><input id="q" type="search" placeholder="Search items" value="${esc(S.q)}" aria-label="Search items">
      <select id="fMode" aria-label="Type"><option value="all">Giveaway and exchange</option><option value="giveaway">Giveaways</option><option value="exchange">Exchanges</option></select>
      ${MODULES.status ? `<select id="fStat" aria-label="Status"><option value="available">Available</option><option value="claimed">Claimed</option><option value="all">All items</option></select>` : ""}
      <button class="btn" id="goPost">List an item</button></div>
    <div class="cats">${["All", ...CATS].map(c => `<button class="${S.cat === c ? "on" : ""}" data-cat="${c}">${c}</button>`).join("")}</div>
    <div class="list">${list.length ? list.map(i => rowHTML(i, false)).join("") : `<div class="empty">Nothing matches yet. Try another category, or list the first one.</div>`}</div>`;
  $("#fMode").value = S.mode; if ($("#fStat")) $("#fStat").value = S.status;
}

/* events */
document.addEventListener("click", e => {
  if (e.target.closest("#avBtn")) $("#user").classList.toggle("open");
  else { $("#user").classList.remove("open"); if (e.target.closest("#menu button")) document.activeElement?.blur(); }
  const t = e.target.closest("button, .brand"); if (!t) return;
  if (t.dataset.close !== undefined) t.closest("dialog").close();
  if (t.dataset.cat) { S.cat = t.dataset.cat; render(); }
  if (t.dataset.contact) openContact(S.items.find(i => i.id === t.dataset.contact));
  if (t.dataset.req) openReq(S.items.find(i => i.id === t.dataset.req));
  if (t.dataset.st) setStatus(...t.dataset.st.split("|"));
  if (t.dataset.del) remove(t.dataset.del);
  if (t.id === "goPost") S.user ? $("#dPost").showModal() : openAuth(false, "Sign in to list an item.");
  if (t.id === "goAuth") openAuth(false);
  if (t.id === "pSave") saveName();
});
$("#home").onclick = e => { e.preventDefault(); Object.assign(S, { view: "browse", cat: "All", q: "", mode: "all" }); load(); window.scrollTo({ top: 0, behavior: "smooth" }); };
$("#nBrowse").onclick = () => { S.view = "browse"; load(); window.scrollTo({ top: 0 }); };
const goProfile = () => { S.view = "mine"; load(); window.scrollTo({ top: 0 }); };
$("#mProfile").onclick = goProfile;
$("#delGo").onclick = doDelete;
$("#cCopy").onclick = () => navigator.clipboard.writeText($("#cVal").textContent).then(() => toast("Copied"));
$("#nAuth").onclick = () => openAuth(false);
$("#mOut").onclick = () => sb.auth.signOut().then(() => { S.view = "browse"; toast("Signed out"); });
$("#aSwap").onclick = () => openAuth(!S.signup, $("#aNote").textContent);
$("#aGo").onclick = submitAuth; $("#pGo").onclick = publish; $("#rGo").onclick = sendReq;
$("#pMode").onchange = e => $("#wantBox").hidden = e.target.value !== "exchange";
$("#pCat").innerHTML = CATS.map(c => `<option>${c}</option>`).join("");
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; const p = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(p, p); } });
document.addEventListener("change", e => { if (e.target.id === "avFile" && e.target.files[0]) saveAvatar(e.target.files[0]); if (e.target.id === "fMode") { S.mode = e.target.value; render(); } if (e.target.id === "fStat") { S.status = e.target.value; render(); } });

if (sb) initAuth().then(load); else render();
</script>
</body>
</html>
