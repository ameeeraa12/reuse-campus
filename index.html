<style>
:root{--ink:#0a0c10;--mute:#5b6478;--blue:#3b82f6;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.8);--line:rgba(15,23,42,.1);--panel:rgba(255,255,255,.88);--bg:rgba(255,255,255,.7);--err:#b4232c;--shadow:0 10px 40px rgba(37,99,235,.14)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;display:flex;flex-direction:column;color:var(--ink);font:16px/1.55 "Outfit",system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:radial-gradient(60vw 55vh at 90% -5%,#93c5fd 0,transparent 70%),radial-gradient(55vw 50vh at -5% 35%,#bae6fd 0,transparent 70%),radial-gradient(40vw 40vh at 70% 100%,#dbeafe 0,transparent 70%),linear-gradient(160deg,#fff,#eaf3ff 60%,#d6e8ff);background-attachment:fixed}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 20px}
main{flex:1}
[hidden]{display:none!important}
.glass,.bar,.row,header .wrap,.cats button,.cfg{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--edge);box-shadow:var(--shadow)}
header{position:sticky;top:0;z-index:20;padding:12px 0}
header .wrap{display:flex;align-items:center;gap:14px;height:58px;border-radius:99px;padding:0 10px 0 22px;max-width:1000px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em;margin-right:auto;cursor:pointer;display:flex;align-items:center;gap:9px}
.brand svg{width:30px;height:30px;flex:none}
nav{display:flex;gap:6px}
nav button{background:rgba(255,255,255,.6);border:1px solid var(--line);color:var(--ink);padding:6px 16px;cursor:pointer;border-radius:99px;transition:background .15s}
nav button:hover{background:#fff}
nav button.on{background:none;border-color:transparent;font-weight:700;cursor:default;position:relative}
nav button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-3px;width:20px;height:3px;border-radius:3px;background:var(--blue)}
.av.on{box-shadow:0 0 0 3px rgba(59,130,246,.55)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:99px;padding:10px 20px;font-weight:600;cursor:pointer;transition:background .2s}
.btn:hover{background:#1d4ed8}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#fff}
.btn.sm{padding:6px 15px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
h1{font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.04em;margin:56px 0 14px;max-width:13em;font-weight:700}
.lede{color:var(--mute);margin:0 0 30px;max-width:32em;font-size:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:10px;border-radius:22px;margin-bottom:16px}
.bar input,.bar select{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.bar input{flex:1;min-width:180px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.cats button{border-radius:99px;padding:6px 16px;color:var(--mute);cursor:pointer;font-size:15px;box-shadow:none}
.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.row{display:flex;flex-direction:column;border-radius:24px;overflow:hidden}
.pic{aspect-ratio:4/3;position:relative;display:grid;place-items:center;font-size:64px;font-weight:700;color:#93c5fd;background:linear-gradient(135deg,#e0f2fe,#fff 60%,#bfdbfe)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row.claimed .pic img{filter:grayscale(1);opacity:.55}
.prof{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:22px;border-radius:28px;margin-top:40px}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;position:relative;display:grid;place-items:center;font-size:34px;font-weight:700;color:#3b82f6;background:linear-gradient(135deg,#e0f2fe,#bfdbfe);cursor:pointer;border:3px solid #fff;flex:none;margin:0}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pinfo{flex:1;min-width:160px}
.pname{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.pedit{display:flex;gap:8px;flex-wrap:wrap}
.pedit input{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:9px 13px;width:180px}
.pill{position:absolute;top:12px;left:12px;font-size:13px;font-weight:600;padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.85);color:#0369a1;backdrop-filter:blur(8px)}
.pill.c{background:var(--ink);color:#fff}
.body{padding:16px 18px 6px;flex:1}
.row h3{margin:0;font-size:19px;letter-spacing:-.02em;line-height:1.25}
.row.claimed h3{color:var(--mute)}
.meta{color:var(--mute);font-size:14px;margin-top:4px}
.desc{font-size:15px;margin:8px 0 0}
.side{padding:12px 18px 18px;display:flex;gap:8px;flex-wrap:wrap}
.empty{grid-column:1/-1;padding:56px 20px;text-align:center;color:var(--mute)}
.reqs{margin:0 14px 14px;padding:10px 14px;background:rgba(255,255,255,.7);border-radius:14px;font-size:14px}
.reqs p{margin:4px 0}
dialog{border:1px solid var(--edge);border-radius:26px;background:var(--panel);backdrop-filter:blur(24px);color:var(--ink);padding:26px;width:min(460px,92vw);box-shadow:0 30px 80px rgba(30,64,175,.25)}
dialog::backdrop{background:rgba(147,197,253,.35);backdrop-filter:blur(6px)}
dialog h2{margin:0 0 14px;font-size:24px;letter-spacing:-.03em}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
dialog input,dialog select,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{resize:vertical;min-height:76px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.msg{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(236,242,250,.85);color:var(--ink);border:1px solid rgba(148,163,184,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(30,64,175,.18);padding:11px 20px;border-radius:99px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
#toast::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:10px}
.note{margin:0 0 4px;padding:10px 14px;border-radius:12px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:#1e3a8a;font-size:14px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.act{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:9px 18px;font-weight:600;text-decoration:none;color:#fff;transition:filter .15s}
.act:hover{filter:brightness(.92)}
.act svg{width:18px;height:18px;flex:none}
.act.call,.act.mail{background:#2563eb}
.act.wa{background:#25d366}
#toast.show{opacity:1}
.cfg{border-radius:20px;padding:16px 22px;margin-top:30px}
footer{margin-top:64px;padding:26px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(15,23,42,.08);text-align:center;color:var(--mute);font-size:14px;background:rgba(255,255,255,.35)}
.btn.ghost.danger{color:#d92d20;border-color:rgba(217,45,32,.3)}
.btn.ghost.danger:hover{background:rgba(217,45,32,.1)}
.btn.red,.btn.red:hover{background:#d92d20;color:#fff}
.btn.red:hover{background:#b42318}
a.btn{text-decoration:none;display:inline-block}
.brand{white-space:nowrap;text-decoration:none;color:var(--ink)}
.user{position:relative;flex:none}
.av{width:42px;height:42px;border-radius:50%;border:2px solid #fff;padding:0;overflow:hidden;position:relative;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,#0a0c10,#3b82f6);cursor:pointer;box-shadow:0 2px 12px rgba(37,99,235,.3)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:0;top:100%;padding-top:12px;min-width:230px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility .18s;z-index:30}
.user.open .menu{opacity:1;visibility:visible;transform:none}
@media(hover:hover) and (pointer:fine){.user:hover .menu{opacity:1;visibility:visible;transform:none}}
.mbox{background:rgba(255,255,255,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--edge);border-radius:18px;box-shadow:0 20px 50px rgba(30,64,175,.22);padding:8px}
.mhead{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.mhead b{display:block;font-size:16px}
.mhead span{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.mbox button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:15px}
.mbox button:hover{background:rgba(59,130,246,.12)}
#mOut{color:#d92d20;font-weight:600}
#mOut:hover{background:rgba(217,45,32,.1)}
.cval{margin:14px 0 0;padding:14px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:18px;font-weight:600;word-break:break-word}
@media(max-width:640px){header .wrap{padding:0 8px 0 16px;gap:6px;height:54px}.brand{font-size:16px;gap:7px}.brand svg{width:26px;height:26px}nav{gap:4px}nav button{padding:5px 9px;font-size:14px}.av{width:38px;height:38px}.bar input{flex:1 1 100%}.bar select{flex:1 1 calc(50% - 5px);min-width:0}.bar .btn{flex:1 1 100%}.cats{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px 22px;padding:2px 20px 8px;scrollbar-width:none}.cats button{flex:none}.list{grid-template-columns:1fr}.prof{flex-direction:column;align-items:flex-start}.pedit{width:100%}.pedit input{flex:1;width:auto}h1{margin-top:36px}.lede{font-size:16px}}
@media(prefers-reduced-motion:reduce){#toast,.btn{transition:none}}
.row{cursor:pointer;transition:transform .18s,box-shadow .18s}
.row:hover{transform:translateY(-3px)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#e11d48;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;pointer-events:none;line-height:1}
.badge.mb{position:static;display:inline-grid;margin-left:8px;border:0;vertical-align:middle}
.heart{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.88);display:grid;place-items:center;cursor:pointer;color:#0a0c10;backdrop-filter:blur(8px);z-index:2}
.heart svg{width:18px;height:18px}
.heart.on,.icon.on{color:#e11d48}
.heart.on svg,.icon.on svg{fill:currentColor}
.pcount{position:absolute;bottom:10px;right:10px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(10,12,16,.65);color:#fff}
.pcount svg{width:14px;height:14px}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.7);display:inline-grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.icon:hover{background:#fff}
.icon svg{width:19px;height:19px}
.icon.sm{width:34px;height:34px}
.icon.sm svg{width:16px;height:16px}
.rc{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer;font-size:inherit}
.tabs{display:flex;gap:8px;margin:28px 0 20px;overflow-x:auto;align-items:center;padding-bottom:4px;scrollbar-width:none}
.tabs button:not(.btn){background:var(--glass);border:1px solid var(--edge);border-radius:99px;padding:8px 18px;cursor:pointer;color:var(--mute);white-space:nowrap;flex:none}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs .btn{margin-left:auto;flex:none}
.trow{display:flex;align-items:center;gap:12px;width:100%;padding-top:14px;border-top:1px solid var(--line);color:var(--mute)}
.switch{width:46px;height:26px;border-radius:99px;background:rgba(100,116,139,.45);border:0;position:relative;cursor:pointer;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--blue)}
.switch.on::after{transform:translateX(20px)}
.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--mute)}
.rq{padding:16px 18px;border-radius:20px;margin-bottom:12px}
.rq.new{border-left:4px solid var(--blue)}
.rtop{display:flex;justify-content:space-between;gap:12px}
.rmsg{margin:8px 0;font-size:15px}
.rq .links{align-items:center}
.th{position:relative;display:inline-block;width:72px;height:72px;margin:4px 8px 4px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(10,12,16,.75);color:#fff;cursor:pointer;line-height:1;padding:0}
.addph{display:inline-block;margin-top:6px;cursor:pointer;color:var(--ink)}
dialog.wide{width:min(980px,94vw);max-height:90vh;padding:0;overflow:hidden}
.dgrid{display:grid;grid-template-columns:1fr 1fr;max-height:90vh}
.gal{position:relative;min-height:440px;background:linear-gradient(135deg,#e0f2fe,#fff 60%,#bfdbfe)}
.car{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car>*{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.car .ph{display:grid;place-items:center;font-size:96px;font-weight:700;color:#93c5fd}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);cursor:pointer;font-size:24px;line-height:1;color:#0a0c10;padding:0 0 3px}
.cnav.l{left:12px}.cnav.r{right:12px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:6px;justify-content:center;pointer-events:none}
.dots i{width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.65);transition:width .2s}
.dots i.on{background:#fff;width:22px}
.dinfo{padding:30px 28px;overflow-y:auto;max-height:90vh;display:flex;flex-direction:column;gap:14px}
.dinfo h2{font-size:28px;line-height:1.15;margin:0}
.dinfo .pill{position:static;align-self:flex-start}
.dtop{display:flex;justify-content:space-between;align-items:center;padding-right:44px;min-height:42px}
.dic{display:flex;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span{padding:4px 12px;border-radius:99px;background:rgba(59,130,246,.12);color:#1d4ed8;font-size:14px;font-weight:500}
.ddesc{margin:0;color:var(--ink);white-space:pre-wrap}
.lister{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.avatar.sm{width:48px;height:48px;font-size:20px;border-width:2px}
.dact{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.x{position:absolute;top:12px;right:12px;z-index:6;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;line-height:1;cursor:pointer;color:#0a0c10;padding:0 0 2px}
@media(max-width:720px){dialog.wide{max-height:92vh;overflow-y:auto}.dgrid{grid-template-columns:1fr;max-height:none}.gal{min-height:0;aspect-ratio:4/3}.dinfo{max-height:none;overflow:visible;padding:22px 20px}.tabs .btn{display:none}}
html[data-theme=dark]{color-scheme:dark;--ink:#eaf1ff;--mute:#9aa8c4;--glass:rgba(22,32,54,.6);--edge:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);--panel:rgba(18,27,46,.95);--bg:rgba(255,255,255,.07);--shadow:0 10px 40px rgba(0,0,0,.35)}
html[data-theme=dark] body{background:radial-gradient(60vw 55vh at 90% -5%,#1e3a8a 0,transparent 70%),radial-gradient(55vw 50vh at -5% 35%,#0c4a6e 0,transparent 70%),linear-gradient(160deg,#0b1220,#0d1730 60%,#0a1428);background-attachment:fixed}

html[data-theme=dark] .btn.ghost.danger{color:#ff8b82}
html[data-theme=dark] .btn.red{background:#d92d20;color:#fff}
html[data-theme=dark] nav button{background:rgba(255,255,255,.08);color:var(--ink)}
html[data-theme=dark] nav button:hover{background:rgba(255,255,255,.16)}
html[data-theme=dark] nav button.on{background:none}

html[data-theme=dark] .pic,html[data-theme=dark] .gal{background:linear-gradient(135deg,#12243f,#0f1b33 60%,#1b3563)}

html[data-theme=dark] .pill.c{background:var(--ink);color:#0b1220}
html[data-theme=dark] .heart,html[data-theme=dark] .cnav,html[data-theme=dark] .x{background:rgba(15,23,42,.85);color:var(--ink)}
html[data-theme=dark] .heart.on,html[data-theme=dark] .icon.on{color:#fb7185}
html[data-theme=dark] .mbox{background:var(--panel)}

html[data-theme=dark] .badge{border-color:#0b1220}

</style>

<body>
<header><div class="wrap">
  <a class="brand" id="home" href="./" aria-label="ReUse Campus home"><svg aria-hidden="true" viewBox="0 0 32 32"><defs><linearGradient id="lgh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lgh)"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5A7 7 0 0 1 21.6 11"/><path d="M22.5 17.5A7 7 0 0 1 10.4 21"/><path d="M22 7.5v4h-4"/><path d="M10 24.5v-4h4"/></g></svg><span>ReUse Campus</span></a>
  <nav><button id="nBrowse" class="on" aria-current="page">Browse</button></nav>
  <button class="btn sm" id="nAuth">Sign in</button>
  <div class="user" id="user" hidden>
    <button class="av" id="avBtn" aria-label="Account menu" aria-haspopup="menu"><span id="avIn"></span></button><span class="badge" id="avBadge" hidden></span>
    <div class="menu" id="menu" role="menu"><div class="mbox">
      <div class="mhead"><b id="mName"></b><span id="mMail"></span></div>
      <button role="menuitem" id="mProfile">Profile<span class="badge mb" id="mBadge" hidden></span></button>
      <button role="menuitem" id="mOut">Sign out</button>
    </div></div>
  </div>
</div></header>

<main class="wrap" id="app"></main>
<footer><div class="wrap">© 2026 ReUse Campus | Designed by Afreen</div></footer>

<dialog id="dAuth"><h2 id="aTitle">Sign in</h2>
  <p class="note" id="aNote" hidden></p>
  <div id="nameBox" hidden><label for="aName">Your name</label><input id="aName" autocomplete="name"></div>
  <label for="aMail">College email</label><input id="aMail" type="email" autocomplete="email">
  <label for="aPass">Password</label><input id="aPass" type="password" minlength="6" autocomplete="current-password">
  <div class="msg" id="aMsg"></div>
  <div class="acts"><button class="btn ghost sm" id="aSwap">Create an account</button><button class="btn ghost sm" data-close>Cancel</button><button class="btn sm" id="aGo">Sign in</button></div>
</dialog>

<dialog id="dPost"><h2 id="pHead">List an item</h2>
  <label for="pTitle">What is it?</label><input id="pTitle" maxlength="80" placeholder="Engineering Mathematics, 3rd edition">
  <label for="pCat">Category</label><select id="pCat"></select>
  <label for="pMode">How do you want to pass it on?</label>
  <select id="pMode"><option value="giveaway">Giveaway</option><option value="exchange">Exchange</option></select>
  <div id="wantBox" hidden><label for="pWant">What would you like in return?</label><input id="pWant" maxlength="80"></div>
  <label for="pCond">Condition</label>
  <select id="pCond"><option>Like new</option><option selected>Good</option><option>Worn but usable</option></select>
  <label for="pDesc">Details</label><textarea id="pDesc" maxlength="400" placeholder="Edition, size, where to pick it up"></textarea>
  <label for="pContact">How should people reach you? (phone, WhatsApp or email)</label><input id="pContact" maxlength="80" placeholder="98xxxxxxxx or name@college.edu">
  <label>Photos (up to 5)</label><div id="pThumbs"></div><label class="btn ghost sm addph" id="addPh" for="pImg">+ Add photos</label><input id="pImg" type="file" accept="image/*" multiple hidden>
  <div class="msg" id="pMsg"></div>
  <div class="acts"><button class="btn ghost sm" data-close>Cancel</button><button class="btn sm" id="pGo">Publish</button></div>
</dialog>

<dialog id="dItem" class="wide" aria-label="Item details"><button class="x" data-close aria-label="Close">×</button>
  <div class="dgrid"><div class="gal"><div class="car" id="car"></div><button class="cnav l" id="cPrev" aria-label="Previous photo">‹</button><button class="cnav r" id="cNext" aria-label="Next photo">›</button><div class="dots" id="dots"></div></div>
  <div class="dinfo" id="dInfo"></div></div></dialog>

<dialog id="dContact"><h2 id="cTitle"></h2><p class="meta" id="cItem"></p><div class="cval" id="cVal"></div>
  <div class="links" id="cLinks"></div>
  <div class="acts"><button class="btn ghost sm" id="cCopy">Copy</button><button class="btn sm" data-close>Close</button></div>
</dialog>

<dialog id="dDel"><h2>Delete this listing?</h2><p class="meta" id="delItem"></p>
  <p>This permanently removes the listing and its details. This can’t be undone.</p>
  <div class="acts"><button class="btn sm" data-close>Cancel</button><button class="btn red sm" id="delGo">Delete</button></div>
</dialog>

<dialog id="dReq"><h2 id="rTitle">Request item</h2>
  <label for="rMsg">Message to the owner</label><textarea id="rMsg" placeholder="When are you free to pick it up?"></textarea>
  <label for="rContact">How can they reach you?</label><input id="rContact" placeholder="Phone, hostel room or email">
  <div class="msg" id="rErr"></div>
  <div class="acts"><button class="btn ghost sm" data-close>Cancel</button><button class="btn sm" id="rGo">Send request</button></div>
</dialog>
<div id="toast" role="status"></div>

<script>
(function(){function show(m){var a=document.getElementById("app");if(a)a.innerHTML='<h1>Something went wrong.</h1><div class="cfg"><b>Please send this message to the developer:</b><p style="word-break:break-word">'+String(m).replace(/</g,"&lt;")+'</p></div>';}
window.addEventListener("error",function(e){var t=e.target;show(t&&t.src?"Could not load "+t.src:(e.message||"Unknown error"));},true);
window.addEventListener("unhandledrejection",function(e){show((e.reason&&e.reason.message)||e.reason);});})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== Module 0: configuration (paste your Supabase project values) ===== */
const SUPABASE_URL = "https://yqfobtksoylnpbupyrmx.supabase.co";
const SUPABASE_KEY = "sb_publishable_vY8uFiNSy9FY3A65izxnWw_iRTCRgtS";
/* Switch modules on or off here. Modules 1-3 (accounts, listings, search) are always on. */
const MODULES = { requests: false, status: false }; /* Module 4: requests, Module 5: claimed status */
const CATS = ["Textbooks","Lab coats","Calculators","Stationery","Drawing tools","Electronics","Other"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = d => { const m = (Date.now() - new Date(d)) / 6e4; return m < 60 ? Math.max(1, Math.round(m)) + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };
let tt; function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2600); }
const configured = !SUPABASE_URL.startsWith("YOUR_");
let sb = null, cfgErr = "";
if (configured) { try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (err) { cfgErr = err.message; } }
const S = { user: null, items: [], reqs: [], saved: new Set(), view: "browse", ptab: "listings", cat: "All", q: "", mode: "all", status: MODULES.status ? "available" : "all", reqItem: null, signup: false, detail: null };
const MAXP = 5, BUCKET = "item-images";
const svg = (p, f) => `<svg viewBox="0 0 24 24" fill="${f || "none"}" stroke="${f ? "none" : "currentColor"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  phone: svg('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>'),
  mail: svg('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>'),
  wa: svg('<path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>', "currentColor"),
  heart: svg('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>'),
  share: svg('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>'),
  img: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>')
};
const myName = () => S.user?.user_metadata?.name || S.user?.email?.split("@")[0] || "Student";
const myAvatar = () => S.user?.user_metadata?.avatar || null;
const imgsOf = i => (i.images && i.images.length) ? i.images : (i.image_url ? [i.image_url] : []);
const isMine = i => !!S.user && i.owner === S.user.id;
const unread = () => S.reqs.filter(r => !r.seen).length;
const avHTML = (url, name) => url ? `<img src="${esc(url)}" alt="">` : esc((name || "?")[0].toUpperCase());
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const pathOf = u => { const k = "/" + BUCKET + "/", j = (u || "").indexOf(k); return j < 0 ? null : decodeURIComponent(u.slice(j + k.length).split("?")[0]); };
const dropFiles = urls => { const p = urls.map(pathOf).filter(Boolean); if (p.length) sb.storage.from(BUCKET).remove(p); };
function setTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem("theme", t); } catch (e) {} }
function shrink(file, max = 1100){ return new Promise(res => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => res(b), "image/jpeg", .82); }; im.onerror = () => res(null); im.src = URL.createObjectURL(file); }); }

/* ===== Module 1: accounts ===== */
async function initAuth(){
  const { data } = await sb.auth.getSession(); S.user = data.session?.user ?? null;
  sb.auth.onAuthStateChange((_e, s) => { S.user = s?.user ?? null; load(); });
}
function paintNav(){
  const u = S.user; $("#nAuth").hidden = !!u; $("#user").hidden = !u; if (!u) return;
  $("#avIn").innerHTML = avHTML(myAvatar(), myName());
  $("#mName").textContent = myName(); $("#mMail").textContent = u.email;
  const n = unread(); for (const id of ["#avBadge", "#mBadge"]) { $(id).hidden = !n; $(id).textContent = n > 9 ? "9+" : n; }
}
function openAuth(signup, note = ""){
  S.signup = signup; $("#aTitle").textContent = signup ? "Create account" : "Sign in";
  $("#nameBox").hidden = !signup; $("#aGo").textContent = signup ? "Create account" : "Sign in";
  $("#aSwap").textContent = signup ? "I have an account" : "Create an account"; $("#aMsg").textContent = "";
  $("#aNote").textContent = note; $("#aNote").hidden = !note;
  if (!$("#dAuth").open) $("#dAuth").showModal();
}
async function submitAuth(){
  const email = $("#aMail").value.trim(), password = $("#aPass").value, name = $("#aName").value.trim();
  if (!email || password.length < 6) return $("#aMsg").textContent = "Enter an email and a password of at least 6 characters.";
  if (S.signup && !name) return $("#aMsg").textContent = "Enter your name so owners know who is asking.";
  const r = S.signup ? await sb.auth.signUp({ email, password, options: { data: { name } } }) : await sb.auth.signInWithPassword({ email, password });
  if (r.error) return $("#aMsg").textContent = r.error.message;
  if (S.signup && !r.data.session) { $("#aMsg").textContent = "Check your inbox to confirm your email, then sign in."; return; }
  $("#dAuth").close(); toast("Signed in");
}
async function saveName(){
  const name = $("#pName").value.trim(); if (!name) return toast("Name cannot be empty");
  const { error } = await sb.auth.updateUser({ data: { name } }); if (error) return toast(error.message);
  await sb.from("listings").update({ owner_name: name }).eq("owner", S.user.id); toast("Name updated"); load();
}
async function saveAvatar(f){
  toast("Uploading photo..."); const blob = await shrink(f, 400); if (!blob) return toast("That file is not a readable image");
  const path = `${S.user.id}/avatar-${Date.now()}.jpg`;
  const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg" }); if (up.error) return toast(up.error.message);
  const url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  const { error } = await sb.auth.updateUser({ data: { avatar: url } }); if (error) return toast(error.message);
  await sb.from("listings").update({ owner_avatar: url }).eq("owner", S.user.id); toast("Profile photo updated"); load();
}

/* ===== Data ===== */
let hashDone = false;
async function load(){
  const { data, error } = await sb.from("listings").select("*").order("created_at", { ascending: false });
  S.items = error ? [] : data; S.reqs = []; S.saved = new Set();
  if (S.user) {
    const ids = S.items.filter(isMine).map(i => i.id);
    const [r, sv] = await Promise.all([
      MODULES.requests && ids.length ? sb.from("requests").select("*").in("listing_id", ids).order("created_at", { ascending: false }) : { data: [] },
      sb.from("saved").select("listing_id")]);
    S.reqs = r.data || []; S.saved = new Set((sv.data || []).map(x => x.listing_id));
  }
  paintNav(); render();
  if ($("#dItem").open) { S.items.some(i => i.id === S.detail) ? fillInfo() : $("#dItem").close(); }
  if (!hashDone) { hashDone = true; const m = location.hash.match(/^#item=(.+)$/); if (m) S.items.some(i => i.id === m[1]) ? openDetail(m[1]) : toast("That listing is no longer available"); }
}

/* ===== Module 2: listings (create, edit, delete, multiple photos) ===== */
let D = { id: null, imgs: [], removed: [] };
function drawThumbs(){
  $("#pThumbs").innerHTML = D.imgs.map((m, i) => `<div class="th"><img src="${esc(m.url)}" alt=""><button type="button" data-rmimg="${i}" aria-label="Remove photo">×</button></div>`).join("");
  $("#addPh").hidden = D.imgs.length >= MAXP;
}
function openPost(it){
  if ($("#dItem").open) $("#dItem").close();
  D = { id: it ? it.id : null, imgs: it ? imgsOf(it).map(u => ({ url: u })) : [], removed: [] };
  $("#pHead").textContent = it ? "Edit listing" : "List an item"; $("#pGo").textContent = it ? "Save changes" : "Publish";
  $("#pTitle").value = it?.title || ""; $("#pCat").value = it?.category || CATS[0]; $("#pMode").value = it?.mode || "giveaway";
  $("#pWant").value = it?.wanted || ""; $("#wantBox").hidden = (it?.mode || "giveaway") !== "exchange";
  $("#pCond").value = it?.condition || "Good"; $("#pDesc").value = it?.description || ""; if (it) $("#pContact").value = it.contact || "";
  $("#pMsg").textContent = ""; drawThumbs(); $("#dPost").showModal();
}
function addFiles(files){
  for (const f of files) { if (D.imgs.length >= MAXP) { toast("You can add up to " + MAXP + " photos"); break; } D.imgs.push({ url: URL.createObjectURL(f), file: f }); }
  $("#pImg").value = ""; drawThumbs();
}
function removeImg(i){ const m = D.imgs.splice(i, 1)[0]; if (m.file) URL.revokeObjectURL(m.url); else D.removed.push(m.url); drawThumbs(); }
async function publish(){
  const title = $("#pTitle").value.trim(); if (!title) return $("#pMsg").textContent = "Give the item a name.";
  const contact = $("#pContact").value.trim(); if (!contact) return $("#pMsg").textContent = "Add a phone number or email so people can reach you.";
  const mode = $("#pMode").value, btn = $("#pGo"); btn.disabled = true; $("#pMsg").textContent = "";
  const urls = [];
  for (const m of D.imgs) {
    if (!m.file) { urls.push(m.url); continue; }
    $("#pMsg").textContent = "Uploading photos...";
    const blob = await shrink(m.file); if (!blob) { btn.disabled = false; return $("#pMsg").textContent = "One file is not a readable image."; }
    const path = `${S.user.id}/${Date.now()}-${urls.length}.jpg`;
    const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/jpeg" });
    if (up.error) { btn.disabled = false; return $("#pMsg").textContent = "Photo upload failed: " + up.error.message; }
    urls.push(sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
  }
  const row = { title, category: $("#pCat").value, mode, wanted: mode === "exchange" ? $("#pWant").value.trim() : null, condition: $("#pCond").value, description: $("#pDesc").value.trim(), contact, images: urls, image_url: urls[0] || null };
  const { error } = D.id ? await sb.from("listings").update(row).eq("id", D.id) : await sb.from("listings").insert({ ...row, owner_name: myName(), owner_avatar: myAvatar() });
  btn.disabled = false; $("#pMsg").textContent = "";
  if (error) return $("#pMsg").textContent = error.message;
  dropFiles(D.removed); $("#dPost").close(); toast(D.id ? "Changes saved" : "Published"); load();
}
let delId = null;
function remove(id){ const it = S.items.find(i => i.id === id); delId = id; $("#delItem").textContent = it ? it.title : ""; $("#dDel").showModal(); }
async function doDelete(){
  const it = S.items.find(i => i.id === delId);
  const { error } = await sb.from("listings").delete().eq("id", delId); $("#dDel").close();
  if (error) return toast(error.message); if (it) dropFiles(imgsOf(it)); toast("Listing deleted"); load();
}

/* ===== Module 3: category search ===== */
function filtered(){
  const q = S.q.toLowerCase();
  return S.items.filter(i => (S.cat === "All" || i.category === S.cat) && (S.mode === "all" || i.mode === S.mode) && (S.status === "all" || i.status === S.status) && (!q || (i.title + " " + (i.description || "")).toLowerCase().includes(q)));
}

/* ===== Module 4: requests ===== */
function contactActions(c, subject, waText){
  c = (c || "").trim(); const d = c.replace(/[^\d+]/g, "");
  if (c.includes("@")) return `<a class="act mail" href="mailto:${esc(c)}?subject=${encodeURIComponent(subject)}">${IC.mail}Email</a>`;
  if (d.replace("+", "").length >= 8) { const n = d.replace("+", ""), wa = n.length === 10 ? "91" + n : n; return `<a class="act call" href="tel:${esc(d)}">${IC.phone}Call</a><a class="act wa" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(waText)}">${IC.wa}WhatsApp</a>`; }
  return "";
}
function openContact(it){
  if (!S.user) return openAuth(false, `Sign in to contact ${it.owner_name} about “${it.title}”.`);
  $("#cTitle").textContent = "Contact " + it.owner_name; $("#cItem").textContent = "About: " + it.title;
  $("#cVal").textContent = (it.contact || "").trim() || "The lister has not added contact details.";
  $("#cLinks").innerHTML = contactActions(it.contact, "ReUse Campus: " + it.title, "Hi! I saw your " + it.title + " on ReUse Campus."); $("#dContact").showModal();
}
function openReq(item){
  if (!S.user) return openAuth(false, "Sign in to request this item.");
  S.reqItem = item; $("#rTitle").textContent = "Request: " + item.title; $("#rErr").textContent = ""; $("#dReq").showModal();
}
async function sendReq(){
  const contact = $("#rContact").value.trim(); if (!contact) return $("#rErr").textContent = "Add a way for the owner to reach you.";
  const { error } = await sb.from("requests").insert({ listing_id: S.reqItem.id, requester_name: myName(), contact, message: $("#rMsg").value.trim() });
  if (error) return $("#rErr").textContent = error.code === "23505" ? "You have already requested this item." : error.message;
  $("#dReq").close(); $("#rMsg").value = ""; toast("Request sent to " + S.reqItem.owner_name);
}
async function markRead(ids){
  if (!ids.length) return; await sb.from("requests").update({ seen: true }).in("id", ids);
  S.reqs.forEach(r => { if (ids.includes(r.id)) r.seen = true; }); paintNav(); render();
}

/* ===== Module 5: availability ===== */
async function setStatus(id, status){
  const { error } = await sb.from("listings").update({ status }).eq("id", id);
  if (error) return toast(error.message);
  toast(status === "claimed" ? "Marked as claimed" : "Marked as available"); load();
}

/* ===== Saved items and sharing ===== */
async function toggleSave(id){
  if (!S.user) return openAuth(false, "Sign in to save items.");
  if (S.saved.has(id)) { S.saved.delete(id); await sb.from("saved").delete().eq("listing_id", id).eq("user_id", S.user.id); toast("Removed from saved"); }
  else { S.saved.add(id); const { error } = await sb.from("saved").insert({ listing_id: id }); if (error) { S.saved.delete(id); toast(error.message); } else toast("Saved"); }
  render(); if ($("#dItem").open) fillInfo();
}
async function shareItem(id){
  const it = S.items.find(i => i.id === id); if (!it) return;
  const url = location.origin + location.pathname + "#item=" + id, data = { title: it.title + " on ReUse Campus", text: it.title + " is up for grabs on ReUse Campus", url };
  if (navigator.share) { try { await navigator.share(data); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch (e) { toast(url); }
}

/* ===== Item detail window ===== */
function openDetail(id){
  const it = S.items.find(i => i.id === id); if (!it) return; S.detail = id;
  const imgs = imgsOf(it), car = $("#car");
  car.innerHTML = imgs.length ? imgs.map((u, k) => `<img src="${esc(u)}" alt="${esc(it.title)}, photo ${k + 1}">`).join("") : `<div class="ph">${esc(it.category[0])}</div>`;
  $("#cPrev").hidden = $("#cNext").hidden = imgs.length < 2;
  $("#dots").innerHTML = imgs.length > 1 ? imgs.map((_, k) => `<i class="${k ? "" : "on"}"></i>`).join("") : "";
  fillInfo(); if (!$("#dItem").open) $("#dItem").showModal(); car.scrollLeft = 0; $("#dInfo").scrollTop = 0;
  try { history.replaceState(null, "", "#item=" + id); } catch (e) {}
}
function fillInfo(){
  const it = S.items.find(i => i.id === S.detail); if (!it) return;
  const claimed = it.status === "claimed", mine = isMine(it), n = S.items.filter(x => x.owner === it.owner).length, saved = S.saved.has(it.id);
  const acts = mine ? `<button class="btn" data-edit="${it.id}">Edit listing</button>`
    : (claimed ? `<span class="meta">This item has already been claimed.</span>` : `<button class="btn" data-contact="${it.id}">Contact lister</button>` + (MODULES.requests ? `<button class="btn ghost" data-req="${it.id}">Request item</button>` : ""));
  $("#dInfo").innerHTML = `<div class="dtop"><div>${MODULES.status ? `<span class="pill s ${claimed ? "c" : ""}">${claimed ? "Claimed" : "Available"}</span>` : ""}</div><div class="dic"><button class="icon ${saved ? "on" : ""}" data-save="${it.id}" aria-label="${saved ? "Remove from saved" : "Save item"}">${IC.heart}</button><button class="icon" data-share="${it.id}" aria-label="Share">${IC.share}</button></div></div>
    <h2>${esc(it.title)}</h2>
    <div class="chips"><span>${esc(it.category)}</span><span>${esc(it.condition)}</span><span>${it.mode === "exchange" ? "Exchange" + (it.wanted ? " for " + esc(it.wanted) : "") : "Giveaway"}</span></div>
    <p class="ddesc">${it.description ? esc(it.description) : "The lister hasn’t added more details."}</p>
    <div class="lister"><div class="avatar sm">${avHTML(it.owner_avatar, it.owner_name)}</div><div><b>${esc(it.owner_name)}</b><div class="meta">${plural(n, "item")} listed · posted ${ago(it.created_at)}</div></div></div>
    <div class="dact">${acts}</div>`;
}

/* ===== Interface ===== */
function cardHTML(i){
  const imgs = imgsOf(i), claimed = i.status === "claimed", mine = isMine(i);
  const nreq = mine ? S.reqs.filter(r => r.listing_id === i.id).length : 0;
  const side = mine
    ? `<button class="btn ghost sm" data-edit="${i.id}">Edit</button>` + (MODULES.status ? `<button class="btn ghost sm" data-st="${i.id}|${claimed ? "available" : "claimed"}">${claimed ? "Mark available" : "Mark claimed"}</button>` : "") + `<button class="btn ghost danger sm" data-del="${i.id}">Delete</button>`
    : (!claimed ? `<button class="btn sm" data-contact="${i.id}">Contact lister</button>` + (MODULES.requests ? `<button class="btn ghost sm" data-req="${i.id}">Request</button>` : "") : "") + `<button class="icon sm" data-share="${i.id}" aria-label="Share">${IC.share}</button>`;
  return `<article class="row ${claimed ? "claimed" : ""}" data-open="${i.id}"><div class="pic">${imgs.length ? `<img src="${esc(imgs[0])}" alt="${esc(i.title)}" loading="lazy">` : esc(i.category[0])}
    ${MODULES.status ? `<span class="pill ${claimed ? "c" : ""}">${claimed ? "Claimed" : "Available"}</span>` : ""}
    ${mine ? "" : `<button class="heart ${S.saved.has(i.id) ? "on" : ""}" data-save="${i.id}" aria-label="Save item">${IC.heart}</button>`}
    ${imgs.length > 1 ? `<span class="pcount">${IC.img}${imgs.length}</span>` : ""}</div>
    <div class="body"><h3>${esc(i.title)}</h3>
    <div class="meta">${esc(i.category)} · ${esc(i.condition)} · ${i.mode === "exchange" ? "Exchange" + (i.wanted ? " for " + esc(i.wanted) : "") : "Giveaway"}</div>
    <div class="meta">${esc(i.owner_name)} · ${ago(i.created_at)}${nreq ? ` · <button class="rc" data-ptab="requests">${plural(nreq, "request")}</button>` : ""}</div>
    ${i.description ? `<p class="desc">${esc(i.description)}</p>` : ""}</div>
    <div class="side">${side}</div></article>`;
}
function reqsHTML(){
  if (!S.reqs.length) return `<div class="empty glass">No requests yet. When someone asks for one of your items, it shows up here.</div>`;
  const n = unread();
  return `<div class="rhead"><span>${plural(S.reqs.length, "request")}${n ? `, ${n} new` : ""}</span>${n ? `<button class="btn ghost sm" id="readAll">Mark all as read</button>` : ""}</div>` + S.reqs.map(r => {
    const it = S.items.find(x => x.id === r.listing_id), t = it ? it.title : "an item";
    return `<div class="rq glass ${r.seen ? "" : "new"}"><div class="rtop"><div><b>${esc(r.requester_name)}</b> wants <b>${esc(t)}</b></div><span class="meta">${ago(r.created_at)}</span></div>
      ${r.message ? `<p class="rmsg">“${esc(r.message)}”</p>` : ""}
      <div class="meta">Contact: <b>${esc(r.contact)}</b></div>
      <div class="links">${contactActions(r.contact, "Re: " + t + " on ReUse Campus", "Hi " + r.requester_name + "! About your request for " + t + " on ReUse Campus.")}
      ${r.seen ? "" : `<button class="btn ghost sm" data-read="${r.id}">Mark as read</button>`}
      ${MODULES.status && it && it.status !== "claimed" ? `<button class="btn sm" data-st="${it.id}|claimed">Mark item claimed</button>` : ""}</div></div>`;
  }).join("");
}
function profileHTML(){
  if (!S.user) return `<h1>Your profile</h1><p class="lede">Sign in to manage your profile, listings, requests and saved items.</p><button class="btn" id="goAuth">Sign in</button>`;
  const mine = S.items.filter(isMine), n = unread(), dark = document.documentElement.dataset.theme === "dark", tab = S.ptab;
  const grid = (arr, empty) => `<div class="list">${arr.length ? arr.map(cardHTML).join("") : `<div class="empty">${empty}</div>`}</div>`;
  const body = tab === "requests" ? reqsHTML() : tab === "saved" ? grid(S.items.filter(i => S.saved.has(i.id)), "Nothing saved yet. Tap the heart on an item to keep it here.") : grid(mine, "You have nothing listed yet. Got a calculator gathering dust?");
  return `<section class="glass prof"><label class="avatar" for="avFile" title="Change photo">${avHTML(myAvatar(), myName())}</label><input id="avFile" type="file" accept="image/*" hidden>
    <div class="pinfo"><div class="pname">${esc(myName())}</div><div class="meta">${esc(S.user.email)}</div><div class="meta">${plural(mine.length, "item")} listed</div></div>
    <div class="pedit"><input id="pName" value="${esc(myName())}" maxlength="40" aria-label="Display name"><button class="btn sm" id="pSave">Save name</button></div>
    <div class="trow"><span>Dark mode</span><button class="switch ${dark ? "on" : ""}" id="themeSw" role="switch" aria-checked="${dark}" aria-label="Dark mode"></button></div></section>
    <div class="tabs"><button data-ptab="listings" class="${tab === "listings" ? "on" : ""}">My listings</button><button data-ptab="requests" class="${tab === "requests" ? "on" : ""}">Requests${n ? ` <span class="badge mb">${n}</span>` : ""}</button><button data-ptab="saved" class="${tab === "saved" ? "on" : ""}">Saved</button><button class="btn" id="goPost">List an item</button></div>${body}`;
}
function render(){
  const app = $("#app");
  if (!sb) { app.innerHTML = `<h1>Almost there.</h1><div class="cfg"><b>Connect your database.</b><p>Open index.html and set SUPABASE_URL and SUPABASE_KEY at the top of the script. The URL must look like https://abcdxyz.supabase.co</p>${cfgErr ? `<p>Error: ${esc(cfgErr)}</p>` : ""}</div>`; return; }
  const onB = S.view === "browse"; $("#nBrowse").classList.toggle("on", onB); $("#nBrowse").setAttribute("aria-current", onB ? "page" : "false"); $("#avBtn").classList.toggle("on", !onB);
  if (!onB) { app.innerHTML = profileHTML(); return; }
  const list = filtered();
  app.innerHTML = `<h1>Pass it on before it ends up in a drawer.</h1>
    <p class="lede">Textbooks, lab coats, calculators and more, from students who are done with them to students who need them.</p>
    <div class="bar"><input id="q" type="search" placeholder="Search items" value="${esc(S.q)}" aria-label="Search items">
      <select id="fMode" aria-label="Type"><option value="all">Giveaway and exchange</option><option value="giveaway">Giveaways</option><option value="exchange">Exchanges</option></select>
      ${MODULES.status ? `<select id="fStat" aria-label="Status"><option value="available">Available</option><option value="claimed">Claimed</option><option value="all">All items</option></select>` : ""}
      <button class="btn" id="goPost">List an item</button></div>
    <div class="cats">${["All", ...CATS].map(c => `<button class="${S.cat === c ? "on" : ""}" data-cat="${c}">${c}</button>`).join("")}</div>
    <div class="list">${list.length ? list.map(cardHTML).join("") : `<div class="empty">Nothing matches yet. Try another category, or list the first one.</div>`}</div>`;
  $("#fMode").value = S.mode; if ($("#fStat")) $("#fStat").value = S.status;
}

/* ===== Events ===== */
document.addEventListener("click", e => {
  const a = e.target;
  if (a.closest("#avBtn")) $("#user").classList.toggle("open"); else { $("#user").classList.remove("open"); if (a.closest("#menu button")) document.activeElement?.blur(); }
  if (a === $("#dItem")) return $("#dItem").close();
  const t = a.closest("button, .brand");
  if (!t) { const c = a.closest("[data-open]"); if (c) openDetail(c.dataset.open); return; }
  const d = t.dataset, find = id => S.items.find(i => i.id === id);
  if (d.close !== undefined) t.closest("dialog").close();
  else if (d.cat) { S.cat = d.cat; render(); }
  else if (d.contact) openContact(find(d.contact));
  else if (d.req) openReq(find(d.req));
  else if (d.st) setStatus(...d.st.split("|"));
  else if (d.del) remove(d.del);
  else if (d.edit) openPost(find(d.edit));
  else if (d.save) toggleSave(d.save);
  else if (d.share) shareItem(d.share);
  else if (d.read) markRead([d.read]);
  else if (d.ptab) { S.ptab = d.ptab; S.view = "mine"; render(); }
  else if (d.rmimg !== undefined) removeImg(+d.rmimg);
  else if (t.id === "goPost") S.user ? openPost() : openAuth(false, "Sign in to list an item.");
  else if (t.id === "goAuth") openAuth(false);
  else if (t.id === "pSave") saveName();
  else if (t.id === "readAll") markRead(S.reqs.filter(r => !r.seen).map(r => r.id));
  else if (t.id === "themeSw") { setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); render(); }
});
$("#home").onclick = e => { e.preventDefault(); Object.assign(S, { view: "browse", cat: "All", q: "", mode: "all" }); load(); window.scrollTo({ top: 0, behavior: "smooth" }); };
$("#nBrowse").onclick = () => { S.view = "browse"; render(); window.scrollTo({ top: 0 }); };
const goProfile = () => { S.view = "mine"; render(); window.scrollTo({ top: 0 }); };
$("#mProfile").onclick = goProfile;
$("#nAuth").onclick = () => openAuth(false);
$("#mOut").onclick = () => sb.auth.signOut().then(() => { S.view = "browse"; toast("Signed out"); });
$("#aSwap").onclick = () => openAuth(!S.signup, $("#aNote").textContent);
$("#aGo").onclick = submitAuth; $("#pGo").onclick = publish; $("#rGo").onclick = sendReq; $("#delGo").onclick = doDelete;
$("#cCopy").onclick = () => navigator.clipboard.writeText($("#cVal").textContent).then(() => toast("Copied"));
$("#pMode").onchange = e => $("#wantBox").hidden = e.target.value !== "exchange";
$("#pCat").innerHTML = CATS.map(c => `<option>${c}</option>`).join("");
$("#cPrev").onclick = () => $("#car").scrollBy({ left: -$("#car").clientWidth, behavior: "smooth" });
$("#cNext").onclick = () => $("#car").scrollBy({ left: $("#car").clientWidth, behavior: "smooth" });
$("#car").addEventListener("scroll", () => { const k = Math.round($("#car").scrollLeft / $("#car").clientWidth); [...$("#dots").children].forEach((x, j) => x.classList.toggle("on", j === k)); });
$("#dItem").addEventListener("close", () => { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} });
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; const p = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(p, p); } });
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "avFile" && e.target.files[0]) saveAvatar(e.target.files[0]);
  if (id === "pImg") addFiles([...e.target.files]);
  if (id === "fMode") { S.mode = e.target.value; render(); }
  if (id === "fStat") { S.status = e.target.value; render(); }
});

if (sb) initAuth().then(load); else render();
</script>
</body>
</html>
